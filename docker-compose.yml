version: '3.8'

# Required environment variables (set in .env or shell before running):
#   DATABASE_URL       - Full PostgreSQL connection string (auto-built from vars below)
#   POSTGRES_USER      - Database username (default: power_user)
#   POSTGRES_PASSWORD  - Database password (default: power_password)
#   POSTGRES_DB        - Database name (default: power_gym)
#   OPENAI_API_KEY     - Required for the AI Insights feature
#   SESSION_SECRET     - Used to sign session cookies (set a strong random value)
#
# Usage: docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-power_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-power_password}
      POSTGRES_DB: ${POSTGRES_DB:-power_gym}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-power_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-power_user}:${POSTGRES_PASSWORD:-power_password}@db:5432/${POSTGRES_DB:-power_gym}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
